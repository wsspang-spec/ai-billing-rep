[project]
name = "ai-billing-rep"
version = "0.1.0"
description = "AI telecom billing rep: checks each invoice against dated company records, routes exceptions to a human, acts only after approval."
requires-python = ">=3.12"
dependencies = [
    "anchorbrowser>=1.0.1",
    "anthropic[bedrock]>=1.15.0",
    "arize-otel>=0.14.1",
    "boto3>=1.43.114",
    "daytona>=0.224.1",
    "elevenlabs>=2.73.0",
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "openinference-instrumentation-anthropic>=3.0.3",
    "playwright>=1.64.0",
    "python-dotenv>=1.2.4",
    "reportlab>=4.2.0",
    "surrealdb>=2.0.0",
    "uvicorn[standard]>=0.54.0",
    "pytest>=8.0",
]

[project.scripts]
billingrep = "billingrep.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["billingrep"]
