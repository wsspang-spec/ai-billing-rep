<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1210 410" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" role="img" aria-label="How a bill moves, left to right: collected from the vendor portal by Anchor, the inbox or an upload; Claude on AWS Bedrock reads it; SurrealDB recalls the price on that date; Daytona re-adds the math; Claude decides; then OK to pay, check price, or ask the vendor after approval, filed by Anchor. Arize AX traces every step.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E6E73"/></marker>
    <path id="i-claude" d="M12 2l1.6 6.2L19 4.6l-3.6 5.4L22 12l-6.6 1.9 3.6 5.5-5.4-3.6L12 22l-1.6-6.2L5 19.4l3.6-5.5L2 12l6.6-2L5 4.6l5.4 3.6z"/>
    <g id="i-db" fill="none" stroke-width="2"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
    <g id="i-box" fill="none" stroke-width="2"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/></g>
    <g id="i-globe" fill="none" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></g>
    <g id="i-inbox" fill="none" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M4 14h5l1 2h4l1-2h5"/></g>
    <g id="i-up" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></g>
    <g id="i-check" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5 11-11"/></g>
  </defs>
  <rect width="1210" height="410" fill="#FFFFFF"/>
  <g font-size="14" fill="#1D1D1F">
    <!-- where bills come from -->
    <rect x="16" y="72" width="140" height="56" rx="12" fill="#F5F5F7"/>
    <text x="94" y="96" text-anchor="middle" font-weight="600" font-size="13">Vendor portal</text>
    <text x="94" y="115" text-anchor="middle" fill="#6E6E73" font-size="12">Anchor pulls it</text>
    <rect x="16" y="150" width="140" height="56" rx="12" fill="#F5F5F7"/>
    <text x="94" y="174" text-anchor="middle" font-weight="600" font-size="13">Email inbox</text>
    <text x="94" y="193" text-anchor="middle" fill="#6E6E73" font-size="12">fetched</text>
    <rect x="16" y="228" width="140" height="56" rx="12" fill="#F5F5F7"/>
    <text x="94" y="252" text-anchor="middle" font-weight="600" font-size="13">Upload</text>
    <text x="94" y="271" text-anchor="middle" fill="#6E6E73" font-size="12">drag and drop</text>
    <!-- the sequence -->
    <rect x="196" y="136" width="150" height="84" rx="14" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="271" y="184" text-anchor="middle" font-weight="600">Claude reads it</text>
    <text x="271" y="204" text-anchor="middle" fill="#6E6E73" font-size="12">AWS Bedrock · any PDF</text>
    <rect x="370" y="136" width="150" height="84" rx="14" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="445" y="184" text-anchor="middle" font-weight="600">Price on that date</text>
    <text x="445" y="204" text-anchor="middle" fill="#6E6E73" font-size="12">SurrealDB memory</text>
    <rect x="544" y="136" width="150" height="84" rx="14" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="619" y="184" text-anchor="middle" font-weight="600">Re-add the math</text>
    <text x="619" y="204" text-anchor="middle" fill="#6E6E73" font-size="12">Daytona sandbox</text>
    <rect x="718" y="136" width="150" height="84" rx="14" fill="#1D1D1F"/>
    <text x="793" y="184" text-anchor="middle" font-weight="600" fill="#FFFFFF">Claude decides</text>
    <text x="793" y="204" text-anchor="middle" font-size="12" fill="#D2D2D7">cites its evidence</text>
    <!-- outcomes -->
    <rect x="912" y="56" width="150" height="58" rx="12" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="987" y="80" text-anchor="middle" font-weight="600">OK to pay</text>
    <text x="987" y="99" text-anchor="middle" fill="#6E6E73" font-size="12">scheduled before due</text>
    <rect x="912" y="149" width="150" height="58" rx="12" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="987" y="173" text-anchor="middle" font-weight="600">Check price</text>
    <text x="987" y="192" text-anchor="middle" fill="#6E6E73" font-size="12">held for you</text>
    <rect x="912" y="242" width="150" height="58" rx="12" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="987" y="266" text-anchor="middle" font-weight="600">Ask vendor</text>
    <text x="987" y="285" text-anchor="middle" fill="#6E6E73" font-size="12">you approve first</text>
    <rect x="1088" y="242" width="114" height="58" rx="12" fill="#F5F5F7"/>
    <text x="1153" y="266" text-anchor="middle" font-weight="600" font-size="13">Anchor files</text>
    <text x="1153" y="285" text-anchor="middle" fill="#6E6E73" font-size="12">on the portal</text>
    <!-- watcher -->
    <rect x="196" y="340" width="866" height="46" rx="12" fill="#F5F5F7"/>
    <text x="640" y="368" text-anchor="middle" font-size="13"><tspan font-weight="600">Arize AX</tspan> <tspan fill="#6E6E73">traces every step above and scores the agent on labeled cases</tspan></text>
  </g>
  <!-- sponsor icons -->
  <g class="icons">
    <use href="#i-globe" stroke="#8B6CF0" transform="translate(23 91) scale(0.7)"/>
    <use href="#i-inbox" stroke="#8A90A2" transform="translate(23 169) scale(0.7)"/>
    <use href="#i-up" stroke="#8A90A2" transform="translate(23 247) scale(0.7)"/>
    <use href="#i-claude" fill="#E08A62" transform="translate(260 144) scale(0.95)"/>
    <use href="#i-db" stroke="#FF5FB4" transform="translate(434 144) scale(0.95)"/>
    <use href="#i-box" stroke="#8A90A2" transform="translate(608 144) scale(0.95)"/>
    <use href="#i-claude" fill="#E08A62" transform="translate(782 144) scale(0.95)"/>
    <use href="#i-check" stroke="#4CAF50" transform="translate(918 64) scale(0.6)"/>
    <use href="#i-globe" stroke="#8B6CF0" transform="translate(1093 247) scale(0.6)"/>
    <use href="#i-check" stroke="#4CAF50" transform="translate(206 351) scale(0.95)"/>
  </g>
  <g stroke="#6E6E73" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M156 100 C 178 100, 176 160, 194 168"/>
    <path d="M156 178 L 194 178"/>
    <path d="M156 256 C 178 256, 176 196, 194 188"/>
    <path d="M346 178 L 368 178"/>
    <path d="M520 178 L 542 178"/>
    <path d="M694 178 L 716 178"/>
    <path d="M868 166 C 892 166, 888 85, 910 85"/>
    <path d="M868 178 L 910 178"/>
    <path d="M868 190 C 892 190, 888 271, 910 271"/>
    <path d="M1062 271 L 1086 271"/>
    <path d="M629 338 L 629 222" stroke-dasharray="4 4"/>
  </g>
  <g font-size="12" font-weight="700" fill="#FFFFFF">
    <circle cx="86" cy="52" r="11" fill="#0066CC"/><text x="86" y="56" text-anchor="middle">1</text>
    <circle cx="271" cy="120" r="11" fill="#0066CC"/><text x="271" y="124" text-anchor="middle">2</text>
    <circle cx="445" cy="120" r="11" fill="#0066CC"/><text x="445" y="124" text-anchor="middle">3</text>
    <circle cx="619" cy="120" r="11" fill="#0066CC"/><text x="619" y="124" text-anchor="middle">4</text>
    <circle cx="793" cy="120" r="11" fill="#0066CC"/><text x="793" y="124" text-anchor="middle">5</text>
    <circle cx="1145" cy="222" r="11" fill="#0066CC"/><text x="1145" y="226" text-anchor="middle">6</text>
    <circle cx="180" cy="363" r="11" fill="#0066CC"/><text x="180" y="367" text-anchor="middle" font-size="13">∞</text>
  </g>
</svg>
