<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Billing Rep</title>
<style>
:root{--bg:#0B0D12;--panel:#141821;--panel2:#1A1F2B;--line:#262C3A;--ink:#E6E8EE;--muted:#8A90A2;--dim:#5B6273;--blue:#7AA2F7;--green:#9ECE6A;--amber:#E0AF68;--red:#F7768E;--purple:#BB9AF7;--claude:#E08A62;--surreal:#FF5FB4;--mono:ui-monospace,"SF Mono",Menlo,monospace}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;color:var(--ink);font-size:15px;line-height:1.45}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:12px 28px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(11,13,18,.85);backdrop-filter:blur(14px);z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px}
.logo{width:28px;height:28px;border-radius:8px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.nav{display:flex;gap:4px}.nav a{padding:6px 12px;border-radius:999px;color:var(--muted)}.nav a.on{background:var(--panel2);color:var(--ink);font-weight:600}.nav a:hover{text-decoration:none;color:var(--ink)}
.right{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:13px}
.live{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:blink 2s infinite}
main{max-width:1120px;margin:0 auto;padding:28px 28px 64px;display:flex;flex-direction:column;gap:18px;animation:fade .35s ease}
h1{margin:0;font-size:30px;font-weight:600;letter-spacing:-.02em}
h2{margin:0;font-size:15px;font-weight:600}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sub{margin:6px 0 0;color:var(--muted);font-size:16px}
.btn{min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:14px;transition:all .15s}
.btn:hover{border-color:#3A4254}.btn:active{transform:scale(.97)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#0B0D12;font-weight:600}
.btn.white{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
.btn.small{min-height:30px;padding:0 12px;font-size:12px;color:var(--muted)}
.btn:disabled{opacity:.35;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.between{justify-content:space-between}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;animation:rise .45s ease both}
.panel.glow{border-color:#34406A;box-shadow:0 0 0 1px rgba(122,162,247,.12),0 10px 40px rgba(122,162,247,.07)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.card{padding:16px 18px;border-radius:14px;background:var(--panel);border:1px solid var(--line);animation:rise .45s ease both}
.card .v{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:4px}
.card.amber .v{color:var(--amber)}.card.green .v{color:var(--green)}.card.blue .v{color:var(--blue)}
.list{display:flex;flex-direction:column}
.item{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:14px 4px;border-top:1px solid var(--line);animation:slide .45s cubic-bezier(.2,.8,.2,1) both}
.item:first-child{border-top:0}
.av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#0B0D12;flex:0 0 auto}
.item .who{flex:1 1 240px;min-width:0}.item .who b{font-weight:600;font-size:15px}.item .who div{color:var(--muted);font-size:13px}
.amt{text-align:right;font-variant-numeric:tabular-nums}.amt div:first-child{font-size:15px}.amt div:last-child{font-size:12px;color:var(--muted);font-family:var(--mono)}
.pill{font-size:12px;padding:4px 10px;border-radius:999px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.s-Explained{color:var(--green);background:rgba(158,206,106,.1);border-color:rgba(158,206,106,.3)}
.s-Needs-clarification,.s-Approved,.s-Held{color:var(--amber);background:rgba(224,175,104,.1);border-color:rgba(224,175,104,.35)}
.s-Needs-review{color:var(--red);background:rgba(247,118,142,.1);border-color:rgba(247,118,142,.35)}
.s-Awaiting-vendor-response{color:var(--blue);background:rgba(122,162,247,.1);border-color:rgba(122,162,247,.35)}
.s-Duplicate,.s-Checking{color:var(--muted);background:var(--panel2);border-color:var(--line)}
.drop{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 18px;border:1.5px dashed #343B4C;border-radius:14px;color:var(--muted);font-size:14px;transition:all .2s}
.drop.over{border-color:var(--blue);background:rgba(122,162,247,.06);transform:scale(1.01)}
.alert{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:12px 16px;border-radius:12px;background:rgba(247,118,142,.08);border:1px solid rgba(247,118,142,.35);color:var(--red);font-size:14px;animation:slide .3s ease}
.alert button{border:0;background:none;color:var(--red);font-size:18px;line-height:1}
.cols{display:flex;flex-wrap:wrap;gap:18px}.cols>*{flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:18px}
.lines{border-radius:12px;background:var(--panel2);padding:2px 16px}
.ln{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.ln:last-child{border-bottom:0;font-weight:600}
.ln span:nth-child(2){flex:1}.ln .n{width:20px;color:var(--dim);font-family:var(--mono)}.num{font-variant-numeric:tabular-nums}
.ln.bad{color:var(--amber);font-weight:600}.ln.ok{color:var(--green)}
.note{font-size:13px;color:var(--muted)}
.ok{color:var(--green)}.warn{color:var(--amber)}.err{color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);font-size:13px}
.chip:hover{text-decoration:none;border-color:var(--blue)}
.tline{display:flex;gap:4px;align-items:stretch}
.seg{flex:1;border-radius:12px;padding:12px 14px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);position:relative}
.seg b{display:block;font-size:22px;color:var(--ink)}
.seg.on{border-color:rgba(158,206,106,.5);background:rgba(158,206,106,.08);color:var(--green)}.seg.on b{color:var(--green)}
.seg.bad{border-color:rgba(247,118,142,.5);background:rgba(247,118,142,.08);color:var(--red)}.seg.bad b{color:var(--red)}
.marker{position:absolute;left:50%;bottom:-24px;transform:translateX(-50%);font-size:11px;font-weight:600;white-space:nowrap;color:var(--ink);font-family:var(--mono);animation:bob 1.6s ease-in-out infinite}
/* compact pipeline (inbox rows) */
.pipe{display:flex;align-items:center;gap:0;margin:8px 0 0}
.pdot{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--line);color:var(--dim);transition:all .3s}
.pdot svg{width:12px;height:12px}
.pdot.done{color:var(--c);border-color:var(--c);box-shadow:0 0 10px color-mix(in srgb,var(--c) 45%,transparent)}
.pdot.live{color:var(--blue);border-color:var(--blue);animation:pulse 1.1s infinite}
.pwire{width:22px;height:1.5px;background:var(--line)}.pwire.done{background:var(--blue)}
/* agent run (detail) */
.run{display:flex;flex-direction:column;gap:0}
.rstep{display:grid;grid-template-columns:40px 150px 1fr 90px;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);opacity:0;animation:rise .45s ease forwards}
.rstep:first-child{border-top:0}
.rico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--panel2);border:1px solid var(--c);color:var(--c);box-shadow:0 0 14px color-mix(in srgb,var(--c) 35%,transparent)}
.rico svg{width:18px;height:18px}
.rname{font-weight:600;font-size:14px}.rname small{display:block;font-weight:400;color:var(--muted);font-family:var(--mono);font-size:11px}
.rdet{font-size:13px;color:var(--ink)}
.rbar{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;position:relative}
.rbar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--c);transform-origin:left;animation:fill .7s ease forwards}
.rdur{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right;margin-top:4px}
.rstep.stop .rico{--c:var(--red)}.rstep.stop .rname{color:var(--red)}
.guards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.guard{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:13px;opacity:0;animation:rise .4s ease forwards}
.guard b{display:block;font-size:13px}.guard .gi{font-size:14px;line-height:1.2}
.guard.pass .gi{color:var(--green)}.guard.stop{border-color:rgba(247,118,142,.45)}.guard.stop .gi{color:var(--red)}.guard.fix{border-color:rgba(224,175,104,.45)}.guard.fix .gi{color:var(--amber)}
.steps{display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:26px 110px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;align-items:start}
.step:first-child{border-top:0}.step .t{font-weight:600}
.ic{display:inline-flex}.ic svg{width:16px;height:16px}
table.fin{width:100%;border-collapse:collapse;font-size:14px}table.fin td{padding:10px 2px;border-top:1px solid var(--line)}table.fin tr:first-child td{border-top:0}table.fin td:last-child{text-align:right;font-variant-numeric:tabular-nums}
details>summary{cursor:pointer;list-style:none}details>summary::-webkit-details-marker{display:none}
.spinner{display:inline-block;width:11px;height:11px;border:2px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-1px;margin-right:6px}
/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}
.grid{position:absolute;inset:-50%;background-image:linear-gradient(rgba(122,162,247,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(122,162,247,.07) 1px,transparent 1px);background-size:44px 44px;transform:perspective(600px) rotateX(55deg);animation:gridmove 6s linear infinite;mask-image:radial-gradient(ellipse at center,#000 30%,transparent 70%)}
.orb{position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(122,162,247,.25),rgba(187,154,247,.08) 45%,transparent 70%);filter:blur(20px);animation:breathe 6s ease-in-out infinite}
.login form{position:relative;width:100%;max-width:380px;background:rgba(20,24,33,.82);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:20px;padding:36px 32px;display:flex;flex-direction:column;gap:16px;box-shadow:0 30px 80px rgba(0,0,0,.5);animation:rise .6s ease}
.login label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase}
.login input{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:inherit;font-size:15px;text-transform:none;letter-spacing:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
.login input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(122,162,247,.2)}
.typed{font-family:var(--mono);font-size:13px;color:var(--muted);min-height:18px}.typed::after{content:"▍";color:var(--blue);animation:blink 1s steps(1) infinite}
.sponsors{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.sponsors span{font-family:var(--mono);font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
/* how it works */
.how svg{width:100%;height:auto;display:block}
.how svg>rect:first-of-type{fill:transparent}
.how svg rect{fill:var(--panel2);stroke:var(--line)}
.how svg rect[fill="#1D1D1F"]{fill:#18213A;stroke:var(--blue)}
.how svg text{fill:var(--ink)}.how svg text[fill="#6E6E73"],.how svg text[fill="#D2D2D7"]{fill:var(--muted)}
.how svg .arrows path{stroke:#4A5266;stroke-dasharray:420;stroke-dashoffset:420;animation:draw .9s ease forwards}
.how svg marker path{fill:#4A5266}
.how svg .badges>*{opacity:0;animation:fadein .4s ease forwards}
.qrow{display:grid;grid-template-columns:44px 1fr 90px 70px;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13px;align-items:center;opacity:0;animation:rise .35s ease forwards}
.qrow:first-child{border-top:0}
.tag{font-family:var(--mono);font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;text-align:center}
.tag.pass{color:var(--green);background:rgba(158,206,106,.12)}.tag.fail{color:var(--red);background:rgba(247,118,142,.12)}.tag.skip{color:var(--muted);background:var(--panel2)}
.meter{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--blue));transform-origin:left;animation:fill 1.2s ease forwards}

main.still,main.still .item,main.still .panel,main.still .card,main.still .rstep,main.still .guard,main.still .kpi,main.still .sp{animation:none!important;opacity:1}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{padding:14px 16px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);animation:rise .5s ease both}
.kpi .big{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .what{font-size:13px;font-weight:600;margin-top:2px}.kpi .how{font-size:12px;color:var(--muted)}
.pains{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pain{display:flex;gap:10px;align-items:center;font-size:13px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.02)}
.pain s{color:var(--muted);text-decoration-color:var(--red)}.pain b{color:var(--ink);font-weight:600}.pain .arr{color:var(--blue)}
.engine{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.sp{--c:var(--blue);position:relative;padding:14px;border-radius:14px;border:1px solid color-mix(in srgb,var(--c) 30%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--c) 11%,transparent),transparent 70%);animation:rise .5s ease both;overflow:hidden}
.sp .hd{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600}.sp .hd svg{width:16px;height:16px;color:var(--c)}
.sp .big{font-size:30px;font-weight:700;color:var(--c);font-variant-numeric:tabular-nums;margin-top:6px;text-shadow:0 0 18px color-mix(in srgb,var(--c) 45%,transparent)}
.sp .what{font-size:12px;color:var(--ink)}.sp .how{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:4px}
.sp.on{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 30px color-mix(in srgb,var(--c) 40%,transparent);animation:glowp 1.1s ease-in-out infinite!important}
.sp.on::after{content:"working";position:absolute;top:10px;right:10px;font-family:var(--mono);font-size:10px;color:var(--c)}
@keyframes glowp{50%{box-shadow:0 0 0 1px var(--c),0 0 46px color-mix(in srgb,var(--c) 60%,transparent)}}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.engine{grid-template-columns:repeat(2,1fr)}.pains{grid-template-columns:1fr}}
.livebox{border-radius:12px;overflow:hidden;border:1px solid var(--purple);box-shadow:0 0 40px rgba(187,154,247,.25);background:#000;min-height:120px;display:flex;align-items:center;justify-content:center}
.livebox iframe{width:100%;height:480px;border:0;display:block;background:#000}
.landing{position:relative;display:grid;grid-template-columns:1.25fr .75fr;gap:44px;max-width:1120px;width:100%;align-items:center}
.landing .hero{font-size:40px;line-height:1.12;letter-spacing:-.025em;margin:8px 0 18px}
.mini{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.mini li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;font-size:13px;align-items:center;opacity:0;animation:rise .4s ease forwards}
.mini li b{font-family:var(--mono);color:var(--dim);font-weight:500}.mini li span:last-child{font-family:var(--mono);font-size:11px;color:var(--blue)}
@media (max-width:900px){.landing{grid-template-columns:1fr}.landing .hero{font-size:30px}}
#dock{position:fixed;right:18px;bottom:18px;width:min(620px,92vw);z-index:20;background:var(--panel);border:1px solid var(--purple);border-radius:16px;box-shadow:0 0 0 1px rgba(187,154,247,.3),0 20px 60px rgba(0,0,0,.6),0 0 40px rgba(187,154,247,.25);overflow:hidden;animation:rise .4s ease}
#dock .dh{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:13px;border-bottom:1px solid var(--line)}
#dock .dh b{color:var(--purple)}#dock .dh .sp2{flex:1}
#dock iframe{width:100%;height:380px;border:0;display:block;background:#000}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slide{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(122,162,247,.45)}50%{box-shadow:0 0 0 7px rgba(122,162,247,0)}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadein{to{opacity:1}}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-3px)}}
@keyframes blink{50%{opacity:.25}}
@keyframes gridmove{to{background-position:0 44px}}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.12);opacity:1}}
@media (max-width:680px){.top{padding:10px 14px}main{padding:20px 14px 48px}h1{font-size:24px}.rstep{grid-template-columns:36px 1fr}.rstep .rdet,.rstep>div:last-child{grid-column:2}.qrow{grid-template-columns:40px 1fr 60px}.qrow span:last-child{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $ = (s, el=document) => el.querySelector(s);
const money = n => (n<0?'-':'') + '$' + Math.abs(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const signed = n => (n>0?'+':'') + money(n);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cls = s => 's-' + String(s||'').replace(/[^A-Za-z]/g,'-');
const LABEL = {'Sending':'Sending','Explained':'OK to pay','Needs clarification':'Ask vendor','Needs review':'Check price','Approved':'Approved · send it','Held':'On hold','Awaiting vendor response':'Waiting on vendor','Duplicate':'Duplicate, skipped','Checking':'Checking'};
const label = s => LABEL[s] || s;
const NEEDS = ['Needs clarification','Needs review','Approved','Held'];
const SRC = {'carrier portal':'via Harbor portal (Anchor)', 'inbox':'via inbox', 'upload':'uploaded'};
const vn = v => String(v||'').replace(/\s*\(synthetic\)/ig,'').replace(/\bDemo\s+/,'');
const fmtDate = d => d ? new Date(String(d).slice(0,10)+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '';
const month = d => d ? new Date(String(d).slice(0,10)+'T12:00:00').toLocaleDateString('en-US',{month:'long'}) : '';
const now = () => new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false});
const docName = id => { id = String(id||'').replace(/^term-/,''); const m = id.match(/^(contract|amendment|credit-promise)-([a-z])$/);
  if (m) return ({contract:'Contract',amendment:'Amendment','credit-promise':'Credit message'})[m[1]] + ' ' + m[2].toUpperCase();
  const l = id.match(/-L(\d+)$/); return l ? 'Bill line ' + l[1] : 'Bill ' + id; };
let CUR_INV = '';
const docHref = (id, q) => `/doc/${encodeURIComponent(id)}?q=${encodeURIComponent(q || '')}${CUR_INV ? '&inv=' + encodeURIComponent(CUR_INV) : ''}`;
const vcolor = v => /harbor/i.test(v) ? 'var(--amber)' : 'var(--blue)';
let me = null, timer = null, localErrors = [], STILL = false;

const ICON = {

function pipe(steps, live) {
  const done = new Set(steps); const first = PIPE.findIndex(p => !done.has(p.step));
  return '<div class="pipe">' + PIPE.map((p,i) => (i ? `<div class="pwire ${done.has(p.step)?'done':''}"></div>` : '') +
    `<div class="pdot ${done.has(p.step)?'done':(live && i===first?'live':'')}" style="--c:${p.c}" title="${p.label}">${ICON[p.icon]}</div>`).join('') + '</div>';
}


const prevNum = {};
function countUp() {
  document.querySelectorAll('[data-cu]').forEach(el => {
    const k = el.dataset.cu, to = +el.dataset.v, fmt = el.dataset.f, from = prevNum[k] ?? 0; prevNum[k] = to;
    const show = v => el.textContent = fmt === 'money' ? money(v) : (fmt === 's' ? v.toFixed(1) + ' s' : Math.round(v));
    if (from === to || isNaN(to)) return show(to);
    const t0 = performance.now(); const step = t => { const k2 = Math.min(1, (t - t0) / 700); show(from + (to - from) * (1 - Math.pow(1 - k2, 3))); if (k2 < 1) requestAnimationFrame(step); }; requestAnimationFrame(step);
  });
}

let dockSid = null, dockTick = null; const dockClosed = new Set();
function dock(url, sid, until) {
  if (!url || !sid || !until || until < Date.now() || dockSid === sid || dockClosed.has(sid)) return;
  dockSid = sid; let el = document.getElementById('dock');
  if (!el) { el = document.createElement('div'); el.id = 'dock'; document.body.appendChild(el); }
  el.innerHTML = `<div class="dh"><span class="live"><i style="background:var(--purple);box-shadow:0 0 8px var(--purple)"></i></span><b>Anchor Browser · you have control</b><span class="sp2 note" id="dcount"></span><a href="${esc(url)}" target="_blank">Open ↗</a><button class="btn small" id="ddone">Done</button></div><iframe src="${esc(url)}" title="Anchor cloud browser"></iframe>`;
  const close = async (release) => { clearInterval(dockTick); el.remove(); dockSid = null; dockClosed.add(sid); if (release) await api('/api/anchor/release',{method:'POST',body:JSON.stringify({session_id:sid})}).catch(()=>{}); };
  el.querySelector('#ddone').onclick = () => close(true);
  dockTick = setInterval(() => { const left = Math.round((until - Date.now())/1000); if (left <= 0) return close(false); const c = document.getElementById('dcount'); if (c) c.textContent = `click inside to take over · closes in ${left}s`; }, 500);
}

async function api(path, opts={}) {
  const r = await fetch(path, {credentials:'same-origin', ...opts, headers:{'content-type':'application/json', ...(opts.headers||{})}});
  if (r.status === 401 && path !== '/api/login') { me = null; location.hash = '#/login'; throw new Error('signed out'); }
  const body = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(body.error || body.detail || r.statusText); e.status = r.status; e.body = body; throw e; }
  return body;
}

async function upload(file) {
  if (!/\.pdf$/i.test(file.name) || (file.type && file.type !== 'application/pdf')) {
    localErrors.push(`${file.name} isn't a PDF. Drop a PDF invoice.`); return viewInbox();
  }
  const r = await fetch('/api/upload',{method:'POST',credentials:'same-origin',headers:{'x-filename':file.name},body:file});
  if (!r.ok) { const b = await r.json().catch(()=>({})); localErrors.push(b.detail || b.error || 'Upload failed'); }
  viewInbox();
}

function story(i) {
  const c = i.checks || {}, bad = (c.lines||[]).filter(l => l.verdict !== 'matches_term');
  const t = (i.terms_used||[])[0];
  if (i.status === 'Explained' && i.resolution) return { h: 'Resolved by you.', s: i.resolution + '.' };
  if (i.status === 'Held') return { h: 'Payment on hold.', s: 'You stopped the automatic payment. Release it when you’re ready.' };
  if (i.status === 'Explained') return { h: i.delta ? `${signed(i.delta)}, and it was expected.` : 'Same as last month.', s: t && i.delta ? `The new price started ${fmtDate(t.valid_from)} (${docName(t.source)}). This bill matches it.` : 'Every line matches what you agreed to pay.' };
  if (i.status === 'Needs review') { const l = bad[0]; return { h: 'Billed a price that wasn’t in effect yet.', s: l ? `${money(l.amount)} billed for ${month(i.period_start)}, but the price then was ${money(l.expected)}.` : '' }; }
  if (['Needs clarification','Approved','Awaiting vendor response'].includes(i.status)) { const l = bad[0];
    if (l && l.verdict === 'differs_from_term') return { h: i.status==='Awaiting vendor response' ? 'Asked the vendor to fix the price.' : 'Asking the vendor to fix the price.', s: `Billed ${money(l.amount)} for ${month(i.period_start)}; the price then was ${money(l.expected)}.` };
    return { h: i.status==='Awaiting vendor response' ? 'Asked the vendor about the new charge.' : `${money(c.unsupported_amount)} that nothing explains.`, s: l ? `“${l.description}” isn’t in your contract.` : '' }; }
  if (i.status === 'Duplicate') return { h: 'You already have this bill.', s: 'Same invoice number. The agent stopped before any payment.' };
  return { h: 'Checking…', s: '' };
}

function agentRun(i) {
  const evs = i.events || [], d = i.decision || {};
  const t = e => new Date(e.at).getTime();
  const PIPESTEPS = new Set(PIPE.map(p => p.step).concat(['Duplicate']));
  const looked = [...new Map((d.citations||[]).map(x => [String(x.source).replace(/^term-/,''), x])).values()]
     .map(x => `<a class="chip" href="${docHref(x.source, x.quote)}" target="_blank" title="${esc(x.quote)}">${esc(docName(x.source))} ↗</a>`).join('');
  const steps = evs.map((e, n) => ({ e, p: PIPE.find(p => p.step === e.step), inRun: PIPESTEPS.has(e.step), dur: n && PIPESTEPS.has(e.step) ? (t(e) - t(evs[n-1])) / 1000 : 0 }));
  const runSecs = steps.filter(x => x.inRun).reduce((s, x) => s + Math.max(x.dur, 0), 0);
  const total = runSecs || 1;
  const rows = steps.map((x, n) => {
    const stop = x.e.step === 'Duplicate' || x.e.step === 'Blocked';
    const p = x.p || { icon: stop ? 'stop' : (['Submitted','Browser opened'].includes(x.e.step) ? 'globe' : 'flag'), c: stop ? 'var(--red)' : (['Submitted','Browser opened'].includes(x.e.step) ? 'var(--purple)' : 'var(--blue)'), label: stop ? 'Guard stopped it' : x.e.step, who: x.e.sponsor };
    const w = Math.max(4, Math.round(100 * Math.max(x.dur, 0) / total));
    const extra = x.e.step === 'Decided' && looked ? `<div class="chips" style="margin-top:8px"><span class="note">Looked at:</span>${looked}</div>` : '';
    const right = x.inRun ? `<div class="rbar"><i style="width:${w}%;animation-delay:${n*.12+.1}s"></i></div><div class="rdur">${x.dur ? x.dur.toFixed(1)+' s' : '—'}</div>`
                          : `<div class="rdur">${new Date(x.e.at).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false})}</div>`;
    return `<div class="rstep ${stop?'stop':''}" style="animation-delay:${n*.12}s;--c:${p.c}"><div class="rico">${ICON[p.icon]}</div>
      <div class="rname">${esc(p.label)}<small>${esc(x.e.sponsor || p.who)}</small></div><div class="rdet">${esc(x.e.detail)}${extra}</div><div>${right}</div></div>`; }).join('');
  return `<details class="panel glow run-box"><summary><div class="row between"><div class="row" style="gap:12px"><div class="rico" style="--c:var(--claude)">${ICON.claude}</div>
      <div><div class="lbl">Agent run · ${steps.filter(x=>x.inRun).length} steps · ${runSecs.toFixed(1)} s</div><div style="font-weight:600;margin-top:2px">Claude decided: <span class="pill ${cls(d.model_status || d.status || i.status)}">${esc(label(d.model_status || d.status || i.status))}</span> <span class="note">· click to see every step</span></div></div></div>
      <a class="chip" href="https://app.arize.com" target="_blank" onclick="event.stopPropagation()">Trace in Arize ↗</a></div>
      ${looked ? `<div class="chips" style="margin-top:10px"><span class="note">Checked:</span>${looked}</div>` : ''}</summary>
    <div class="run" style="margin-top:10px">${rows}</div><div class="note">Claude’s reasoning: ${esc(d.summary||'')}</div></details>`;
}

function guardrails(i) {
  const c = i.checks || {}, d = i.decision || {}, a = i.action;
  const g = [];
  if (i.status === 'Duplicate') g.push(['stop','Duplicate check','Same invoice number seen before: stopped, no payment']);
  else g.push(['pass','Duplicate check','New invoice number']);
  if (c.lines) {
    g.push([c.totals_ok ? 'pass' : 'stop', 'Totals add up', c.totals_ok ? `Lines = ${money(c.billed_total)}` : 'Lines don’t match the total']);
    g.push(['pass','Price as of the bill date', `Recalled for ${fmtDate(i.period_start)}, not today’s price`]);
    g.push([(d.citations||[]).length ? 'pass' : 'stop', 'Every claim has a source', `${(d.citations||[]).length} cited documents`]);
  }
  const plain = x => /dropped citations/.test(x) ? 'Claude cited a source that doesn’t exist; the code removed it before you saw it.'
    : /added citations/.test(x) ? 'Claude gave no sources; the code attached the contract terms it checked.'
    : /overridden to Needs review/.test(x) ? 'Claude said OK, but a line didn’t match that month’s price; the code held the bill.'
    : /no term at all/.test(x) ? 'The open charge has no contract term at all; the code routed it to Ask vendor.'
    : /unknown status/.test(x) ? 'Claude gave an unexpected answer; the code held the bill for you.' : x;
  (d.guards||[]).forEach(x => g.push(['fix','Code corrected the model', plain(x)]));
  if (a) g.push([a.status === 'Proposed' ? 'stop' : 'pass', 'Human approval before sending', a.status === 'Proposed' ? 'Waiting for you: sending is blocked' : `Approved by ${a.approved_by}`]);
  if (a?.status === 'Submitted') g.push(['pass','No “sent” without proof', `Portal confirmed ${a.case_id}`]);
  if (i.status === 'Explained') g.push(['pass','Payment only after checks', 'Scheduled (simulated)']);
  const ic = {pass:'✓', stop:'■', fix:'⚠'};
  return `<div class="panel"><div class="row between"><h2>Guardrails</h2><span class="lbl">enforced in code</span></div><div class="guards">${g.map((x,n) =>
    `<div class="guard ${x[0]}" style="animation-delay:${.3+n*.1}s"><span class="gi">${ic[x[0]]}</span><div><b>${esc(x[1])}</b><span class="note">${esc(x[2])}</span></div></div>`).join('')}</div></div>`;
}

function priceTimeline(i) {
  const svc = Object.keys(i.term_history||{})[0]; if (!svc) return '';
  const ts = i.term_history[svc]; const used = (i.terms_used||[])[0];
  const line = (i.checks?.lines||[]).find(l => l.term_id); const billedOk = line ? line.verdict === 'matches_term' : true;
  const segs = ts.map(t => { const on = used && used.key === t.key;
    const until = t.valid_to ? '–' + fmtDate(t.valid_to) : ' onward';
    return `<div class="seg ${on ? (billedOk ? 'on' : 'bad') : ''}"><span class="lbl" style="color:inherit">${fmtDate(t.valid_from)}${until}</span><b>${money(t.value)}</b>
      <a href="${docHref(t.source, t.quote)}" target="_blank" style="font-size:13px">${docName(t.source)} ↗</a>${on ? `<span class="marker">▲ this bill · ${month(i.period_start)}</span>` : ''}</div>`; }).join('');
  return `<div class="panel"><h2>${ts.length > 1 ? 'Price over time' : 'What you agreed to pay'}</h2><div class="tline" style="margin-bottom:22px">${segs}</div></div>`;
}

async function viewHow() {
  STILL = false;
  const [svg, q, st] = await Promise.all([fetch('/static/architecture.svg').then(r => r.text()), api('/api/quality').catch(() => ({cases:[]})), api('/api/stats').catch(() => ({}))]);
  const rows = [
   ['1','Collect.','From the vendor’s portal, the AP inbox, or an upload.','Anchor Browser'],
   ['2','Read.','Claude turns any PDF layout into line items.','Claude on AWS Bedrock'],
   ['3','Recall.','The price that was in effect on the bill’s dates.','SurrealDB'],
   ['4','Re-add.','The math is redone in a sandbox, not trusted from the model.','Daytona'],
   ['5','Decide.','OK to pay, check price, or ask the vendor, with sources.','Claude on AWS Bedrock'],
   ['6','Act, after you approve.','The question is filed on the vendor’s portal.','Anchor Browser'],
   ['∞','Watch.','Every step traced; the agent scored on labeled cases.','Arize AX']];
  const sc = q.score || {}; const pct = sc.case_count ? Math.round(100 * sc.passed / sc.case_count) : 0;
  const trials = Object.entries(q.trials?.by_case || {}).map(([k,v]) => `${k} ${v.passed}/${v.runs}`).join(' · ');
  const qrows = (q.cases||[]).map((c,n) => `<div class="qrow" style="animation-delay:${.05+n*.03}s;grid-template-columns:44px 1fr 90px 70px 150px"><span class="lbl" style="color:var(--ink)">${esc(c.id)}</span><span>${esc(c.task)}${c.not_run && c.reason ? `<br><span class="note">${esc(c.reason)}</span>` : ''}</span>
     <span class="tag ${c.not_run?'skip':(c.passed?'pass':'fail')}">${c.not_run?'NOT BUILT':(c.passed?'PASS':'FAIL')}</span><span class="note" style="text-align:right;font-family:var(--mono)">${c.secs?c.secs+' s':''}</span>
     <span class="note" style="font-family:var(--mono);text-align:right">${c.trace_id ? `<a href="#" data-copy="${esc(c.trace_id)}" title="Copy the trace id, then paste it in Arize's search">trace ${esc(c.trace_id.slice(0,8))}… ⧉</a>` : '—'}</span></div>`).join('');
  const trialRows = Object.entries(q.trials?.by_case || {}).map(([k,v]) => `<div class="qrow" style="grid-template-columns:44px 1fr 90px 70px"><span class="lbl" style="color:var(--ink)">${esc(k)}</span><span>Repeated ${v.runs} times from a clean start</span><span class="tag ${v.passed===v.runs?'pass':'fail'}">${v.passed}/${v.runs}</span><span class="note" style="text-align:right;font-family:var(--mono)">avg ${v.mean_s} s</span></div>`).join('');
  $('#app').innerHTML = shell('how', `<div class="panel glow"><div class="lbl" style="color:var(--red)">The problem</div>
    <div class="pains" style="grid-template-columns:repeat(3,minmax(0,1fr))">
     <div class="pain"><b>Scattered bills</b><span class="note">all month, every carrier, every format</span></div>
     <div class="pain"><b style="color:var(--amber)">Revenue leaks</b><span class="note">charges nobody checks against the contract</span></div>
     <div class="pain"><b style="color:var(--red)">Missed bills</b><span class="note">late fees, services shut off</span></div></div>
    <div style="font-size:15px">Billing Rep checks every bill against your own dated records, holds what doesn’t match, and pays the rest on time.</div></div>
   ${impact(st)}
   <div class="row between"><div><h1>How a bill moves</h1><p class="sub">One agent. Each sponsor does one real job.</p></div><button class="btn" id="replay">Replay</button></div>
   <div class="panel glow how" id="how" style="padding:8px">${svg}</div>
   <div class="panel"><div class="lines how" style="background:transparent;padding:0">${rows.map((r,n) => `<div class="ln" style="font-weight:400;opacity:0;animation:rise .4s ease ${.3+n*.3}s forwards"><span class="n">${r[0]}</span><span><b>${r[1]}</b> ${r[2]}</span><span style="color:var(--blue);font-weight:600;white-space:nowrap">${r[3]}</span></div>`).join('')}</div></div>
   <div class="panel glow"><div class="row between"><div><div class="lbl">Arize AX · experiment</div><h2 style="margin-top:4px">Is the agent right? ${sc.passed ?? '–'} of ${sc.case_count ?? '–'} labeled cases pass</h2></div><a class="chip" href="https://app.arize.com" target="_blank">Open in Arize ↗</a></div>
    <div class="meter"><i style="width:${pct}%"></i></div><div class="note">Run on the real app (${esc(q.model||'')}) · repeat runs: ${esc(trials)} · each case is a traced run in Arize; cases we haven't built yet count as failures.</div>
    <details><summary class="note" style="color:var(--blue);margin-top:4px">See all ${(q.cases||[]).length} cases, repeat runs and trace ids ▾</summary>
     <div class="note" style="margin:10px 0 4px">${esc(q.arize?.detail || '')}${q.run_at ? ' · run ' + esc(q.run_at.replace('T',' ')) : ''}. Click a trace id to copy it, then paste it into Arize’s search.</div>
     <div class="lbl" style="margin-top:12px">Repeat runs</div><div>${trialRows}</div>
     <div class="lbl" style="margin-top:14px">Every case</div><div style="max-height:340px;overflow-y:auto;padding-right:6px;border-top:1px solid var(--line)">${qrows}</div></details></div>`);
  wireShell();
  const s = $('#how svg');
  const ag = [...s.querySelectorAll('g')].find(g => g.getAttribute('marker-end'));
  const order = null;  // the diagram is drawn left to right: animate arrows in document order
  if (ag) { ag.classList.add('arrows');
    [...ag.querySelectorAll('path')].forEach((p,n) => { const t = n * 0.35 + 0.2; p.style.animationDelay = t + 's';
      const dot = document.createElementNS('http://www.w3.org/2000/svg','circle'); dot.setAttribute('r','4.5'); dot.setAttribute('fill', n===10 ? '#9ECE6A' : (n===9 ? '#BB9AF7' : '#7AA2F7')); dot.setAttribute('opacity','0');
      dot.setAttribute('style','filter:drop-shadow(0 0 6px #7AA2F7)');
      const m = document.createElementNS('http://www.w3.org/2000/svg','animateMotion'); m.setAttribute('dur','1.6s'); m.setAttribute('repeatCount','indefinite'); m.setAttribute('begin', (t + 0.9)+'s'); m.setAttribute('path', p.getAttribute('d'));
      const o = document.createElementNS('http://www.w3.org/2000/svg','set'); o.setAttribute('attributeName','opacity'); o.setAttribute('to','1'); o.setAttribute('begin', (t + 0.9)+'s');
      dot.appendChild(m); dot.appendChild(o); s.appendChild(dot); }); }
  const badges = [...s.querySelectorAll('g')].find(g => g.getAttribute('font-weight') === '700');
  if (badges) { badges.classList.add('badges'); [...badges.children].forEach((b,n) => b.style.animationDelay = (0.4 + Math.floor(n/2)*0.4) + 's'); }
  countUp();
  document.querySelectorAll('[data-copy]').forEach(a => a.onclick = async e => { e.preventDefault(); try { await navigator.clipboard.writeText(a.dataset.copy); a.textContent = 'copied ✓'; } catch { prompt('Trace id', a.dataset.copy); } });
  $('#replay').onclick = viewHow;
}

async function route() {
  clearTimeout(timer);
  const h = location.hash || '#/inbox';
  if (h === '#/login') return viewLogin();
  if (!me) { try { const r = await api('/api/me'); me = {...r.user, show_reset: r.show_reset}; } catch { return; } }
  try {
    if (h.startsWith('#/invoice/')) return await viewInvoice(decodeURIComponent(h.slice(10)));
    if (h === '#/how') return await viewHow();
    return await viewInbox();
  } catch (e) { if (e.message !== 'signed out') $('#app').innerHTML = `<main><p class="err">${esc(e.message)}</p><a href="#/inbox">Back</a></main>`; }
}
document.addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('a[href]'); if (!a) return;
  const h = a.getAttribute('href') || '';
  if (/^\/(doc|files|portal)\//.test(h)) { e.preventDefault(); window.open(h, '_blank', 'noopener'); }
});
window.onhashchange = route;
route();
</script>
</body>
</html>
