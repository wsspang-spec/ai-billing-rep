<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" role="img" aria-label="Architecture: invoices and the AP specialist reach the Billing Rep agent, which calls Claude on AWS Bedrock, SurrealDB, Daytona, Anchor Browser and Arize AX">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E6E73"/></marker>
  </defs>
  <rect width="1040" height="470" fill="#FFFFFF"/>
  <g font-size="14" fill="#1D1D1F">
    <!-- inputs -->
    <rect x="20" y="70" width="200" height="74" rx="14" fill="#F5F5F7"/>
    <text x="120" y="102" text-anchor="middle" font-weight="600">Invoice PDFs</text>
    <text x="120" y="124" text-anchor="middle" fill="#6E6E73" font-size="13">AP inbox or drag and drop</text>
    <rect x="20" y="318" width="200" height="74" rx="14" fill="#F5F5F7"/>
    <text x="120" y="350" text-anchor="middle" font-weight="600">AP specialist</text>
    <text x="120" y="372" text-anchor="middle" fill="#6E6E73" font-size="13">signs in, reviews, approves</text>
    <!-- agent -->
    <rect x="320" y="165" width="250" height="140" rx="18" fill="#1D1D1F"/>
    <text x="445" y="222" text-anchor="middle" font-weight="600" font-size="18" fill="#FFFFFF">Billing Rep agent</text>
    <text x="445" y="246" text-anchor="middle" font-size="13" fill="#D2D2D7">FastAPI app · approval gate</text>
    <text x="445" y="266" text-anchor="middle" font-size="13" fill="#D2D2D7">duplicate + totals checks in code</text>
    <!-- services -->
    <rect x="690" y="20" width="230" height="62" rx="14" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="805" y="47" text-anchor="middle" font-weight="600">Claude on AWS Bedrock</text>
    <text x="805" y="67" text-anchor="middle" fill="#6E6E73" font-size="13">reads the PDF, decides</text>
    <rect x="690" y="108" width="230" height="62" rx="14" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="805" y="135" text-anchor="middle" font-weight="600">SurrealDB</text>
    <text x="805" y="155" text-anchor="middle" fill="#6E6E73" font-size="13">prices by effective date, state</text>
    <rect x="690" y="196" width="230" height="62" rx="14" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="805" y="223" text-anchor="middle" font-weight="600">Daytona sandbox</text>
    <text x="805" y="243" text-anchor="middle" fill="#6E6E73" font-size="13">runs the comparison math</text>
    <rect x="690" y="284" width="230" height="62" rx="14" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="805" y="311" text-anchor="middle" font-weight="600">Anchor Browser</text>
    <text x="805" y="331" text-anchor="middle" fill="#6E6E73" font-size="13">files the approved inquiry</text>
    <rect x="690" y="388" width="230" height="62" rx="14" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="805" y="415" text-anchor="middle" font-weight="600">Arize AX</text>
    <text x="805" y="435" text-anchor="middle" fill="#6E6E73" font-size="13">traces every step + evals</text>
    <!-- portal -->
    <rect x="950" y="270" width="80" height="90" rx="12" fill="#F5F5F7"/>
    <text x="990" y="302" text-anchor="middle" font-size="12" font-weight="600">Carrier</text>
    <text x="990" y="318" text-anchor="middle" font-size="12" font-weight="600">portal</text>
    <text x="990" y="338" text-anchor="middle" font-size="11" fill="#6E6E73">synthetic,</text>
    <text x="990" y="352" text-anchor="middle" font-size="11" fill="#6E6E73">on Daytona</text>
  </g>
  <g stroke="#6E6E73" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M220 107 C 270 107, 270 200, 318 205"/>
    <path d="M220 355 C 270 355, 270 270, 318 265"/>
    <path d="M570 190 C 630 190, 630 51, 688 51"/>
    <path d="M570 210 C 630 210, 630 139, 688 139"/>
    <path d="M570 235 L 688 227"/>
    <path d="M570 260 C 630 260, 630 315, 688 315"/>
    <path d="M570 285 C 630 285, 630 419, 688 419" stroke-dasharray="4 4"/>
    <path d="M920 315 L 948 315"/>
  </g>
  <g font-size="12" font-weight="700" fill="#FFFFFF">
    <circle cx="262" cy="150" r="11" fill="#0066CC"/><text x="262" y="154" text-anchor="middle">1</text>
    <circle cx="640" cy="92" r="11" fill="#0066CC"/><text x="640" y="96" text-anchor="middle">2</text>
    <circle cx="640" cy="160" r="11" fill="#0066CC"/><text x="640" y="164" text-anchor="middle">3</text>
    <circle cx="640" cy="231" r="11" fill="#0066CC"/><text x="640" y="235" text-anchor="middle">4</text>
    <circle cx="660" cy="66" r="11" fill="#0066CC"/><text x="660" y="70" text-anchor="middle">5</text>
    <circle cx="262" cy="312" r="11" fill="#0066CC"/><text x="262" y="316" text-anchor="middle">6</text>
    <circle cx="640" cy="300" r="11" fill="#0066CC"/><text x="640" y="304" text-anchor="middle">6</text>
    <circle cx="640" cy="380" r="11" fill="#0066CC"/><text x="640" y="384" text-anchor="middle" font-size="13">∞</text>
  </g>
</svg>
